name: Bug report
description: Report reproducible App Drawer behavior.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I updated the plugin and searched existing issues.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Omarchy and plugin versions
      placeholder: Omarchy …; App Drawer …
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitor topology
      description: Output names and orientations; omit serial numbers.
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      render: shell
