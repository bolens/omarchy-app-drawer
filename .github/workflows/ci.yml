name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      plugin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.plugin == 'true' }}
      repository: ${{ github.event_name != 'pull_request' || steps.filter.outputs.repository == 'true' }}
    steps:
      - name: Classify changed paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            plugin:
              - '*.js'
              - '*.qml'
              - '.githooks/**'
              - '.github/dependabot.yml'
              - '.github/labeler.yml'
              - '.github/labeler.yml'
              - '.github/ci/**'
              - '.github/workflows/**'
              - '.qmllint.ini'
              - 'manifest.json'
              - 'package*.json'
              - 'qmldir'
              - 'scripts/**'
              - 'tests/**'
            repository:
              - '**/*.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
              - '.github/ci/**'
              - '.github/workflows/**'
              - 'docs/**'
              - 'manifest.json'
              - 'package*.json'
              - 'preview.png'
              - 'scripts/build-site.sh'
              - 'site/**'
              - 'tests/**'

  plugin-fast:
    name: Plugin fast checks
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Omarchy validator and QML imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          ref: 13f18b2cb7286fb54f87daf571a031aa6af3d8f0 # v4.0.1
          path: .omarchy
          persist-credentials: false
      - name: Install archive validation tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Check shell scripts
        run: shellcheck scripts/*.sh scripts/capture-screenshots scripts/deploy-shell-runtime scripts/migrate-to-stock-bar scripts/verify-live tests/run_all.sh tests/run_qml_runtime.sh tests/verify-stress
      - name: Validate distributable plugin
        run: |
          mkdir "$RUNNER_TEMP/plugin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/plugin"
          .omarchy/bin/omarchy-plugin-validate "$RUNNER_TEMP/plugin"
          files=$(git archive HEAD | tar -t)
          if grep -E '(^|/)(__pycache__|node_modules|\.pytest_cache)(/|$)|\.py[co]$|\.tar\.gz(\.sha256)?$' <<<"$files"; then
            echo "Release archive contains generated or forbidden files" >&2
            exit 1
          fi
          if grep -E '^(\.github|\.githooks|scripts|tests)/|^package(-lock)?\.json$|(^|/)node_modules/' <<<"$files"; then
            echo "Release archive contains maintainer-only files" >&2
            exit 1
          fi
          if git grep -IlE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}' -- .; then
            echo "Tracked files contain credential-like material" >&2
            exit 1
          fi
          for required in manifest.json README.md LICENSE NOTICE preview.png; do grep -qx "$required" <<<"$files"; done
  plugin-qml:
    name: Plugin behavior and QML
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Omarchy QML imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          ref: 13f18b2cb7286fb54f87daf571a031aa6af3d8f0 # v4.0.1
          path: .omarchy
          persist-credentials: false
      - name: Run portable behavior and QML lint suite
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/source:ro" \
            --tmpfs /workspace:rw,exec,nosuid,size=512m --workdir /workspace \
            ghcr.io/bolens/omarchy-plugin-ci@sha256:293b0457198085de5df26519dd4aa336202495c080d253b71ac30e7d8e8d3851 \
            bash -lc 'cp -a /source/. /workspace && QMLLINT=/usr/lib/qt6/bin/qmllint OMARCHY_PATH=/workspace/.omarchy OMARCHY_SKIP_VALIDATE=1 OMABAR_QML_TESTS=never OMABAR_LIVE_TESTS=never npm test'

  plugin-result:
    name: Plugin
    needs: [changes, plugin-fast, plugin-qml]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected plugin checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.plugin }}
          FAST_RESULT: ${{ needs.plugin-fast.result }}
          QML_RESULT: ${{ needs.plugin-qml.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$SELECTED" == true || "$SELECTED" == false ]]
          [[ "$SELECTED" != true ]] || { [[ "$FAST_RESULT" == success ]] && [[ "$QML_RESULT" == success ]]; }

  pages:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-check
          fail_level: error
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-utils tidy
      - run: npm ci
      - run: npm run build:site && npm run test:site
      - run: |
          tidy -errors -quiet docs/index.html docs/404.html 2>&1 | tee /tmp/tidy.log || true
          if grep -q 'Error:' /tmp/tidy.log; then exit 1; fi
          xmllint --noout docs/favicon.svg docs/sitemap.xml
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-path '(^|/)node_modules/'
            --accept 200,204,206,429
            --exclude '^https://github\.com/bolens/omarchy-app-drawer/(compare|releases/tag)/'
            './**/*.md'
            './_site/**/*.html'
          fail: true
      - name: Audit accessibility
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/site.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npx lighthouse http://127.0.0.1:4173/ --only-categories=accessibility --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse.json
          node -e 'const r=require("/tmp/lighthouse.json"); process.exit(r.categories.accessibility.score===1?0:1)'

  repository-result:
    name: Repository
    needs: [changes, pages]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected repository checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.repository }}
          REPOSITORY_RESULT: ${{ needs.pages.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          [[ "$SELECTED" == true || "$SELECTED" == false ]]
          [[ "$SELECTED" != true ]] || [[ "$REPOSITORY_RESULT" == success ]]
