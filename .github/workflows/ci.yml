name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  validate:
    name: Plugin and repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out Omarchy validator and QML imports
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/omarchy
          path: .omarchy
      - name: Install archive validation tools
        run: sudo apt-get update && sudo apt-get install --yes jq
      - name: Validate distributable plugin
        run: |
          mkdir "$RUNNER_TEMP/plugin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/plugin"
          .omarchy/bin/omarchy-plugin-validate "$RUNNER_TEMP/plugin"
          files=$(git archive HEAD | tar -t)
          if grep -E '^(\.github|scripts|tests)/|^package(-lock)?\.json$|(^|/)node_modules/' <<<"$files"; then
            echo "Release archive contains maintainer-only files" >&2
            exit 1
          fi
          for required in manifest.json README.md LICENSE NOTICE preview.png; do grep -qx "$required" <<<"$files"; done
      - name: Run portable behavior and QML lint suite
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            archlinux@sha256:4bf33b21a715aac0b48ce6e9eaed4782a898eae96f88f5da3635572129c2584a \
            bash -lc 'pacman -Syu --noconfirm diffutils jq nodejs npm quickshell qt6-declarative >/dev/null && QMLLINT=/usr/lib/qt6/bin/qmllint OMARCHY_PATH=/workspace/.omarchy OMARCHY_SKIP_VALIDATE=1 OMABAR_QML_TESTS=never OMABAR_LIVE_TESTS=never npm test'
  pages:
    name: Pages and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-utils tidy
      - run: npm ci
      - run: npm run build:site && npm run test:site
      - run: |
          tidy -errors -quiet docs/index.html docs/404.html 2>&1 | tee /tmp/tidy.log || true
          if grep -q 'Error:' /tmp/tidy.log; then exit 1; fi
          xmllint --noout docs/favicon.svg docs/sitemap.xml
      - name: Audit accessibility
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/site.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          npx lighthouse http://127.0.0.1:4173/ --only-categories=accessibility --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse.json
          node -e 'const r=require("/tmp/lighthouse.json"); process.exit(r.categories.accessibility.score>=.95?0:1)'
