name: CI image

on:
  push:
    branches: [main]
    paths:
      - .github/ci/**
      - .github/workflows/ci-image.yml
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omarchy-plugin-ci:arch
            ${{ github.event_name != 'schedule' && format('ghcr.io/{0}/omarchy-plugin-ci:sha-{1}', github.repository_owner, github.sha) || '' }}
          cache-from: type=gha,scope=omarchy-plugin-ci
          cache-to: type=gha,mode=max,scope=omarchy-plugin-ci
          provenance: mode=max
          sbom: true
