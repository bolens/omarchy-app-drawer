name: CI image

on:
  push:
    branches: [main]
    paths:
      - .github/ci/**
      - .github/workflows/ci-image.yml
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .github/ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omarchy-plugin-ci:arch
            ghcr.io/${{ github.repository_owner }}/omarchy-plugin-ci:sha-${{ github.sha }}
          cache-from: type=gha,scope=omarchy-plugin-ci
          cache-to: type=gha,mode=max,scope=omarchy-plugin-ci
          provenance: mode=max
          sbom: true
