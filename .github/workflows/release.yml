name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and build archive
        run: |
          version=$(jq -r .version manifest.json)
          test "$GITHUB_REF_NAME" = "v$version"
          archive="omarchy-app-drawer-$version.tar.gz"
          git archive --prefix="omarchy-app-drawer-$version/" -o "$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"
      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-path: "*.tar.gz"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version manifest.json)
          archive="omarchy-app-drawer-$version.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --generate-notes --verify-tag
